<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blinkit - Grocery in 10 minutes</title>
    <link rel="stylesheet" href="blinkit.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">

        <!-- Logo -->
        <a href="#" class="logo">blink<span style="color:rgb(3, 154, 3)">it</span></a>

        <!-- Delivery Info -->
        <div class="delivery-info">
            <span class="delivery-title">Delivery in 10 minutes</span>
            <span class="delivery-location">
                ISI-6, RIICO Institutional Area, Sit...
                <span class="dropdown-arrow">▾</span>
            </span>
        </div>

        <!-- Search Bar -->
        <div class="search-bar">
            <i class="bi bi-search search-icon"></i>
            <input type="text" placeholder='Search "butter"'>
        </div>

        <!-- Login -->
        <a href="#" class="login-btn">Login</a>

        <!-- Cart -->
        <button class="cart-btn">
            My Cart
            <i class="bi bi-cart cart-icon"></i>
        </button>

    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content">

        <!-- ===== HERO BANNER ===== -->
        <section class="hero-banner">
            <img src="stockUpDaily.png" alt="Stock up on daily essentials">
        </section>

        <!-- ===== CATEGORY IMAGES ===== -->
        <section class="category-images">
            <img src="PharmacyAtDoorStep.png" alt="Pharmacy at your doorstep">
            <img src="petCare.png" alt="Pet care supplies at your door">
            <img src="noTimeForDiaper.png" alt="No time for a diaper run?">
        </section>

    </main>

</body>

</html>
