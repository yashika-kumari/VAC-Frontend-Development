<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Board</title>
    <link rel="stylesheet" href="ludo.css">
</head>


<body>

    <div class="board">


        <!-- Red Home -->

        <div class="home red-home">

            <div class="inner-box">

                <div class="token red-token"></div>
                <div class="token red-token"></div>
                <div class="token red-token"></div>
                <div class="token red-token"></div>

            </div>

        </div>


        <!-- =====================
             GREEN HOME
             ===================== -->

        <div class="home green-home">

            <div class="inner-box">

                <div class="token green-token"></div>
                <div class="token green-token"></div>
                <div class="token green-token"></div>
                <div class="token green-token"></div>

            </div>

        </div>


        <!-- =====================
             BLUE HOME
             ===================== -->

        <div class="home blue-home">

            <div class="inner-box">

                <div class="token blue-token"></div>
                <div class="token blue-token"></div>
                <div class="token blue-token"></div>
                <div class="token blue-token"></div>

            </div>

        </div>


        <!-- =====================
             YELLOW HOME
             ===================== -->

        <div class="home yellow-home">

            <div class="inner-box">

                <div class="token yellow-token"></div>
                <div class="token yellow-token"></div>
                <div class="token yellow-token"></div>
                <div class="token yellow-token"></div>

            </div>

        </div>


        <!-- =====================
             TOP PATH
             ===================== -->

        <div class="path top-path">

            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell green"></div>
            <div class="cell green"></div>

            <div class="cell"></div>
            <div class="cell green"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell green"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell green"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell green"></div>
            <div class="cell"></div>

        </div>


        <!-- =====================
             BOTTOM PATH
             ===================== -->

        <div class="path bottom-path">

            <div class="cell"></div>
            <div class="cell blue"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell blue"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell blue"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell blue"></div>
            <div class="cell"></div>

            <div class="cell blue"></div>
            <div class="cell blue"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>

        </div>


        <!-- =====================
             LEFT PATH
             ===================== -->

        <div class="path left-path">

            <div class="cell"></div>
            <div class="cell red"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell red"></div>
            <div class="cell red"></div>
            <div class="cell red"></div>
            <div class="cell red"></div>
            <div class="cell red"></div>

            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>

        </div>


        <!-- =====================
             RIGHT PATH
             ===================== -->

        <div class="path right-path">

            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>

            <div class="cell yellow"></div>
            <div class="cell yellow"></div>
            <div class="cell yellow"></div>
            <div class="cell yellow"></div>
            <div class="cell yellow"></div>
            <div class="cell "></div>

            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell yellow"></div>
            <div class="cell"></div>

        </div>


        <!-- =====================
             CENTER
             ===================== -->

        <div class="center">

            <div class="center-triangle green-center"></div>

            <div class="center-triangle yellow-center"></div>

            <div class="center-triangle blue-center"></div>

            <div class="center-triangle red-center"></div>

        </div>

    </div>

</body>

</html>
