<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Facebook - Log In</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="login-page">

        <!-- ================= LEFT SIDE ================= -->
        <div class="left-section">

            <!-- Facebook Wordmark -->
            <div class="facebook-logo">
                facebook
            </div>

            <!-- Empty space for the images from the original page -->
            <div class="image-space"></div>

            <!-- Tagline -->
            <div class="tagline">
                <div>Explore</div>
                <div>the</div>
                <div>things</div>

                <div class="blue-text">
                    you love<span class="black-dot">.</span>
                </div>
            </div>

        </div>


        <!-- Vertical Divider -->
        <div class="divider"></div>


        <!-- ================= RIGHT SIDE ================= -->
        <div class="right-section">

            <div class="login-container">

                <h1>Log in to Facebook</h1>

                <form>

                    <!-- Email -->
                    <input
                        type="text"
                        class="input-field"
                        placeholder="Email address or mobile number"
                    >

                    <!-- Password -->
                    <input
                        type="password"
                        class="input-field"
                        placeholder="Password"
                    >

                    <!-- Login Button -->
                    <button
                        type="submit"
                        class="login-button"
                    >
                        Log in
                    </button>

                </form>


                <!-- Forgot Password -->
                <a href="#" class="forgot-password">
                    Forgotten password?
                </a>


                <!-- Create Account -->
                <div class="account-section">

                    <button class="create-account">
                        Create new account
                    </button>

                </div>


                <!-- Meta -->
                <div class="meta-text">
                    Meta
                </div>

            </div>

        </div>

    </div>

</body>
</html>
