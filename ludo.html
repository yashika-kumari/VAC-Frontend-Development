<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Board</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
        }

        /* =========================
           MAIN BOARD
           ========================= */

        .board {
            width: min(95vw, 600px);
            aspect-ratio: 1 / 1;

            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);

            border: 2px solid black;
            position: relative;
            background: white;
        }


        /* =========================
           HOME AREAS
           ========================= */

        .home {
            position: relative;

            border: 1px solid black;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .red-home {
            grid-column: 1 / 7;
            grid-row: 1 / 7;

            background: #f51f2b;
        }

        .green-home {
            grid-column: 10 / 16;
            grid-row: 1 / 7;

            background: #08a746;
        }

        .blue-home {
            grid-column: 1 / 7;
            grid-row: 10 / 16;

            background: #21489b;
        }

        .yellow-home {
            grid-column: 10 / 16;
            grid-row: 10 / 16;

            background: #ffd91a;
        }


        /* =========================
           INNER HOME BOX
           ========================= */

        .inner-box {
            width: 72%;
            height: 72%;

            background: white;

            border: 1px solid black;

            display: grid;

            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;

            gap: 12%;

            padding: 12%;
        }


        /* =========================
           TOKENS
           ========================= */

        .token {
            width: 70%;
            aspect-ratio: 1 / 1;

            justify-self: center;
            align-self: center;

            border-radius: 50%;

            border: 2px solid black;
        }

        .red-token {
            background: #f51f2b;
        }

        .green-token {
            background: #08a746;
        }

        .blue-token {
            background: #21489b;
        }

        .yellow-token {
            background: #ffd91a;
        }


        /* =========================
           PATHS
           ========================= */

        .path {
            position: absolute;

            display: grid;

            background: white;
        }


        /* Top path */

        .top-path {
            top: 0;
            left: 40%;
            width: 20%;
            height: 40%;

            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(6, 1fr);
        }


        /* Bottom path */

        .bottom-path {
            bottom: 0;
            left: 40%;
            width: 20%;
            height: 40%;

            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(6, 1fr);
        }


        /* Left path */

        .left-path {
            left: 0;
            top: 40%;
            width: 40%;
            height: 20%;

            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }


        /* Right path */

        .right-path {
            right: 0;
            top: 40%;
            width: 40%;
            height: 20%;

            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }


        /* Individual path cells */

        .cell {
            border: 1px solid black;
            background: white;
        }


        /* =========================
           COLORED PATH CELLS
           ========================= */

        /* Green path */

        .green {
            background: #08a746;
        }


        /* Red path */

        .red {
            background: #f51f2b;
        }


        /* Blue path */

        .blue {
            background: #21489b;
        }


        /* Yellow path */

        .yellow {
            background: #ffd91a;
        }


        /* =========================
           CENTER
           ========================= */

        .center {
            position: absolute;

            left: 40%;
            top: 40%;

            width: 20%;
            height: 20%;

            border: 1px solid black;

            background: white;

            overflow: hidden;
        }


        /* Four center triangles */

        .triangle {
            position: absolute;

            width: 0;
            height: 0;
        }


        .triangle.red-triangle {
            left: 0;
            top: 0;

            border-top: 50px solid transparent;
            border-bottom: 50px solid transparent;
            border-left: 50px solid #f51f2b;

            transform: rotate(0deg);
        }


        .triangle.green-triangle {
            right: 0;
            top: 0;

            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-top: 50px solid #08a746;
        }


        .triangle.yellow-triangle {
            right: 0;
            bottom: 0;

            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-bottom: 50px solid #ffd91a;
        }


        .triangle.blue-triangle {
            left: 0;
            bottom: 0;

            border-top: 50px solid transparent;
            border-bottom: 50px solid transparent;
            border-right: 50px solid #21489b;
        }


        /* =========================
           RESPONSIVE TRIANGLES
           ========================= */

        .center {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
        }

        .center::before {
            content: "";

            position: absolute;

            width: 0;
            height: 0;

            left: 0;
            top: 0;

            border-top: 50% solid #08a746;
            border-left: 50% solid transparent;
            border-right: 50% solid transparent;
        }


        /* Easier center using conic gradient */

        .center {
            background:
                conic-gradient(
                    from 45deg,
                    #ffd91a 0deg 90deg,
                    #21489b 90deg 180deg,
                    #f51f2b 180deg 270deg,
                    #08a746 270deg 360deg
                );
        }

        .center::before {
            display: none;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 400px) {

            .board {
                width: 95vw;
            }

            .inner-box {
                gap: 8%;
                padding: 10%;
            }

            .token {
                border-width: 1px;
            }
        }

    </style>
</head>


<body>
